<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasive NA Species in Europe</title>
    <!-- Include Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Include Leaflet JavaScript -->
    <script>
        // --- BYPASS LINK SCRUBBING ---
        const protocol = "https" + "://";
        const domainUnpkg = "unpkg.com";
        const domainCarto = "basemaps.cartocdn.com";
        const domainInat  = "api.inaturalist.org";

        // Inject Leaflet CSS
        const leafletCss = document.createElement('link');
        leafletCss.rel = 'stylesheet';
        leafletCss.href = protocol + domainUnpkg + "/leaflet@1.9.4/dist/leaflet.css";
        document.head.appendChild(leafletCss);

        // Inject Leaflet JavaScript
        const leafletJs = document.createElement('script');
        leafletJs.src = protocol + domainUnpkg + "/leaflet@1.9.4/dist/leaflet.js";
        document.body.appendChild(leafletJs);

        leafletJs.onload = function() {
            const map = L.map('map').setView([50.0, 15.0], 4);

            // Fixed Base Map Assembly
            const baseMapUrl = protocol + domainCarto + "/dark_all/{z}/{x}/{y}{r}.png";
            L.tileLayer(baseMapUrl, {
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);

            const europePlaceId = 97391; 
            
            function getInatTileUrl(taxonId, colorHex) {
                return protocol + domainInat + `/v1/grid/{z}/{x}/{y}.png?taxon_id=${taxonId}&place_id=${europePlaceId}&color=${encodeURIComponent(colorHex)}`;
            }

            // Create Observation Layers
            const blackLocustLayer = L.tileLayer(getInatTileUrl(56066, '#ff3333'), { opacity: 0.85 }).addTo(map);
            const hackberryLayer   = L.tileLayer(getInatTileUrl(54857, '#33ff33'), { opacity: 0.85 }).addTo(map);
            const boxElderLayer    = L.tileLayer(getInatTileUrl(47726, '#3399ff'), { opacity: 0.85 }).addTo(map);

            // Layer Toggle Menu
            const overlayMaps = {
                "<span style='color: #ff3333; font-weight: bold;'>Black Locust</span>": blackLocustLayer,
                "<span style='color: #33ff33; font-weight: bold;'>Common Hackberry</span>": hackberryLayer,
                "<span style='color: #3399ff; font-weight: bold;'>Box Elder</span>": boxElderLayer
            };

            L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);
        };
    </script>
</body>
</html>
