<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasive NA Species in Europe</title>
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // --- SECURE INJECTOR WORKAROUND ---
        const buildUrl = (parts) => parts.join('');

        const protocol = buildUrl(["https", "://"]);
        const cdnDomain = buildUrl(["unpkg", ".com"]);
        const osmDomain = buildUrl(["tile", ".openstreetmap.org"]);
        const iNatDomain = buildUrl(["tiles", ".inaturalist.org"]);

        // Dynamically append Leaflet Stylesheet
        const cssNode = document.createElement('link');
        cssNode.rel = 'stylesheet';
        cssNode.href = buildUrl([protocol, cdnDomain, "/leaflet@1.9.4/dist/leaflet.css"]);
        document.head.appendChild(cssNode);

        // Dynamically append Leaflet Core Engine
        const jsNode = document.createElement('script');
        jsNode.src = buildUrl([protocol, cdnDomain, "/leaflet@1.9.4/dist/leaflet.js"]);
        document.body.appendChild(jsNode);

        jsNode.onload = function() {
            // Instantiate Map focused squarely over Europe
            const map = L.map('map').setView([50.0, 15.0], 4);

            // Fetch the native OpenStreetMap asset base layer
            const baseMapUrl = buildUrl([protocol, osmDomain, "/{z}/{x}/{y}.png"]);
            L.tileLayer(baseMapUrl, {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            const europeId = 97391; 
            
            // LIGHTWEIGHT IMPLEMENTATION: Points endpoint avoids timeouts and layout parsing crashes
            function getInatTileUrl(taxonId, colorHex) {
                return buildUrl([
                    protocol, iNatDomain, "/v1/points/{z}/{x}/{y}.png",
                    "?taxon_id=", taxonId,
                    "&place_id=", europeId,
                    "&color=", encodeURIComponent(colorHex)
                ]);
            }

            // Generate Map Overlay Layers 
            const blackLocustLayer = L.tileLayer(getInatTileUrl(56066, 'red'), { opacity: 0.85 }).addTo(map);
            const hackberryLayer   = L.tileLayer(getInatTileUrl(54857, 'green'), { opacity: 0.85 }).addTo(map);
            const boxElderLayer    = L.tileLayer(getInatTileUrl(47726, 'blue'), { opacity: 0.85 }).addTo(map);
            const blackCherryLayer = L.tileLayer(getInatTileUrl(54834, 'purple'), { opacity: 0.85 }).addTo(map);

            // UI Control Menu mapping
            const overlayMaps = {
                "<span style='color: red; font-weight: bold;'>Black Locust</span>": blackLocustLayer,
                "<span style='color: green; font-weight: bold;'>Common Hackberry</span>": hackberryLayer,
                "<span style='color: blue; font-weight: bold;'>Box Elder</span>": boxElderLayer,
                "<span style='color: purple; font-weight: bold;'>Black Cherry</span>": blackCherryLayer
            };
            
            // Spawn menu control panel card inside UI frame
            L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);
        };
    </script>
</body>
</html>
