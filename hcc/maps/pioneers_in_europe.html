<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasive NA Species in Europe</title>
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // --- SECURE INJECTOR WORKAROUND ---
        const buildUrl = (parts) => parts.join('');

        const protocol = buildUrl(["https", "://"]);
        const cdnDomain = buildUrl(["unpkg", ".com"]);
        const osmDomain = buildUrl(["tile", ".openstreetmap.org"]);
        const iNatDomain = buildUrl(["tiles", ".inaturalist.org"]);

        // Inject Leaflet Stylesheet
        const cssNode = document.createElement('link');
        cssNode.rel = 'stylesheet';
        cssNode.href = buildUrl([protocol, cdnDomain, "/leaflet@1.9.4/dist/leaflet.css"]);
        document.head.appendChild(cssNode);

        // Inject Leaflet Core Engine
        const jsNode = document.createElement('script');
        jsNode.src = buildUrl([protocol, cdnDomain, "/leaflet@1.9.4/dist/leaflet.js"]);
        document.body.appendChild(jsNode);

        jsNode.onload = function() {
            const map = L.map('map').setView([50.0, 15.0], 4);

            // Fetch the native OpenStreetMap base layer
            const baseMapUrl = buildUrl([protocol, osmDomain, "/{z}/{x}/{y}.png"]);
            L.tileLayer(baseMapUrl, {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            const europeId = 97391; 
            
            // ONE REQUEST OVERLAY: Added 50212 (Black Cherry) alongside your other trees
            // Note: When calling multiple taxa, the API switches parameters to "taxon_ids"
            const heatmapTileUrl = buildUrl([
                protocol, iNatDomain, "/v1/heatmap/{z}/{x}/{y}.png",
                "?taxon_ids=56066,54857,47726,50212",
                "&place_id=", europeId,
                "&color=red" // Blends all 4 species profiles into a hot high-density red glow
            ]);

            // Add the single combined tracking layer to the map frame
            L.tileLayer(heatmapTileUrl, { 
                opacity: 0.75,
                attribution: '&copy; <a href="https://www.inaturalist.org">iNaturalist</a>'
            }).addTo(map);
        };
    </script>
</body>
</html>
