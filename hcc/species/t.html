<head>

<style>
input[type=text], select {
  width: 95%;
  padding: 6px 10px;
  margin: 4px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}

input[type=submit] {
  width: fit-content;
  background-color: #333;
  color: white;
  padding: 7px 10px;
  margin: 4px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

input[type=submit]:hover {
  background-color: #171717;
}

<body>
   
<script type="text/javascript"   src='../core/js/common_functions.js'> </script>
<script type="text/javascript"   src='../core/js/store.js'> </script>
   
<script>
let winurlstr = window.location.href;
let winurlsearchstr = window.location.search;
let winurlexsearchstr = winurlstr.replace(winurlsearchstr,'');
let winurlparams = new URLSearchParams(winurlsearchstr.substring(1));
let p_options   = winurlparams.get('options') || [];
let p_taxon_id  = winurlparams.get('taxon_id') || '';
let p_params    = winurlparams.get('params') || '';
let p_q         = winurlparams.get('q') || '';
let p_hide_dash = winurlparams.get('hide_dash') || '';

let config   = '';
appState       = buildStateFromParams(winurlparams);

winurlparams.delete('options');
let p_idextra_ = winurlparams.get('idextra_user_id')?.split(',') || [];;
winurlparams.delete('idextra_user_id');
let p_photo_curl_filename_prefix = winurlparams.get('photo_curl_filename_prefix')?.split(',') || ['photo_id'];
winurlparams.delete('photo_curl_filename_prefix');

// Species Counts Table Column - Name
function buildSpeciesName( brow, rec, url ) {
    let tdName = faddelem('td', brow);
    let a = faddelem('a', tdName, { href: url });
    
    // Common Name 
    faddelem('span', a, { style: { fontSize: 'larger' }, textContent: (rec.preferred_common_name || '').toLowerCase() });
    
    // Scientific Name 
    let br = faddelem('br', a);
    faddelem('span', a, { style: { fontStyle: 'italic' }, textContent: '(' + (rec.name || '') + ')' });
}

function buildIconList( config ) {

    let urlState = appState;
    urlState = setQ(urlState, 'birds');
    urlState = setRank(urlState, 'order');
  
    let url  = './t.html'+buildParameterList(urlState);
    let utf8 = '&#129419;';

    let link = document.createElement('a');

    // Set the destination URL
    link.href = url;
    link.innerHTML = utf8;
    link.style.cursor = 'pointer';
    link.style.textDecoration = 'none';
    link.style.fontSize = '24px';
  
    document.body.appendChild(link);

}
  
function buildMenu( config ) {

    // Create the main navbar container
    let navbar = document.createElement('div');
    navbar.className = 'navbar v2-menu';

    let baseUrl = window.location.origin + window.location.pathname;

    buildNavTitle( navbar, 'Taxon Search' );

  /*
    // if place filters were set in the configuration
    if( config.places && config.places.length > 0 ) {
        buildNavDDPlace( navbar, CONST_PLACE, results, config, baseUrl );
    }

    // if taxon filters were set in the configuration
    if( config.taxa && config.taxa.length > 0 ) {
        let dd_name   = getPlantMenuName(appState) || CONST_CUSTOM_PLANT;  
        buildNavDDTaxa( navbar, dd_name, results, config, baseUrl );
    }
   
    // if observation field filters were set in the configuration
    if( config.ddObsFields && config.ddObsFields.length > 0 ) {
        let dd_name   = config.ddObsFields[0].ddName;  // just take the first one. 
        let menu_name = getFieldValue(appState)||dd_name;

        buildNavDDObsFields( navbar, menu_name, results, config, baseUrl );
    }
    */

    // Build the Home Link
    let homeState = clearForDashParams(appState);
    let homeUrl = '../admin/dashboard.html';
    buildNavHome( navbar, homeUrl, homeState );

    // Append the DOM nodes to the body
    faddelem('p', document.body).appendChild(navbar);

    buildIconList(config);
}
  
function fresults(xobj) {

   let results = xobj.results;
   if (results) {
      let total_results = xobj.total_results;
      let per_page = xobj.per_page;
      let page_curr = xobj.page;
      let page_max = Math.ceil(total_results/per_page);
      let page_prev = ((page_curr>1)?page_curr-1:null);
      let page_next = ((page_curr<page_max)?page_curr+1:null);
      let toggle_args = '';
      let args = '';

      let table = faddelem('table',document.body,{id:'main'});
      let thead = faddelem('thead',table);
      let hrow = faddelem('tr',thead);
      let labels = [
            {innerText:('#')},
            {innerText:'Taxon Name'},   
            {innerText:'Rank'},   
      ];

      faddelems('th',hrow,labels);

      let tbody = faddelem('tbody',table);

      let length = 0;
      if( results.length > 10 ) {
          length = 10;
      } else {
          length = results.length;
      }
      
      for (let i=0; i<length; i++) {
         let brow = faddelem('tr',tbody);
         let rec  = results[i];
         let url  = './species_counts.html'+buildParameterList(appState)+'&menuid='+rec.id;

         // Column: Index
         faddelem('td', brow, { textContent: i + 1 });

         // Column: Taxon Name 
         buildSpeciesName( brow, rec, url );

         // Column: Rank
         faddelem('td', brow, { textContent: rec.rank });

      };

   }
   else { faddelem('p',document.body,{innerText:'No results returned.'}); };
};

function buildForm() {
  let urlState = appState;
  urlState = setQ(urlState, '');
  urlState = setRank(urlState, '');
  
  // Keep the action clean without parameters
  let formHTML = '<div><form action="./t.html" method="GET">';

  // Safely parse parameters and turn them into hidden input fields 
  let paramsString = buildParameterList(urlState); // e.g., "?garden=front&user=1"
  if( paramsString.startsWith('?')) {
      paramsString = paramsString.substring(1);
  }

  if (paramsString) {
      let urlParams = new URLSearchParams(paramsString);
      for( let [key, value] of urlParams.entries()) {
           formHTML += `<input type="hidden" name="${key}" value="${value}">`;
      }
  }

  // Add visible search input and submit button
  formHTML += '<input type="text" id="pname" name="q" placeholder="Enter a full or partial taxon name..">';
  formHTML += '<input type="submit" value="Search">'; 
  formHTML += '</form></div>';

  // Render it to the page
  faddelem('p', document.body, { innerHTML: formHTML });  
}

function setupAPIParams( plantConfig ) {
   let api_params = '';
 
   api_params += '?q='+getQ(appState);
   api_params += '&rank='+getRank(appState);

   return api_params;
}
  
</script>

<script type="text/javascript"   src="../core/js/ConfigManager.js"></script>

<script>
async function gatherResources() {
  let json_path = json_root + getParams(appState);
 
  try {

      // Await the result of getObservations() and store the actual data
      config  = await asyncGetConfiguration( json_path, getComponent(appState) );

      console.log('full config title: ' + config.getFullTitle());
     
    } catch (error) {
      console.error("An error occurred:", error);
      faddelem('p',document.body,{innerHTML:('<span id="error">&#9888;<br>' + error.message + '</span>')}); 
      throw error;
    }
}

let message = validateConfig(appState); 

if( message ) { 
    faddelem('p',document.body,{innerHTML:('<span id="error">⚠<br>' + message + '</span>')}); 
    throw new Error(message); 
} else { 
    // This will now correctly pause and halt the script if it throws
    gatherResources(); 
}

// This code below will NO LONGER run if gatherResources() fails
let apibase = 'https://api.inaturalist.org/v1/taxa/autocomplete'; 
let apiurl = apibase+setupAPIParams(); 
let apirefname = 'Choose Taxon'; 

if( !p_q ) { 
     buildMenu(config); 
     buildForm(); 
} else { 
     buildMenu(config); 
     buildForm(); 
        
     fetch(apiurl) 
          .then((response) => { 
             if (!response.ok) { 
                 throw new Error(response.status+' ('+response.statusText+') returned from '+response.url); 
             }; 
             return response.json(); 
          }) 
           .then((data) => { fresults(data); }) 
           .catch((err) => { 
                console.error(err.message); 
                faddelem('p',document.body,{innerText:'There was a problem retrieving data. Error '+err.message+'.'}); 
          });
}

</script>
</body>

</html>
