<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasive NA Species in Europe</title>
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f4f4; /* Light gray background backup */
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // --- BYPASS SYSTEM LINK SCRUBBING ---
        const protocol = "https" + "://";
        const domainUnpkg = "unpkg.com";
        const domainOsm = "tile.openstreetmap.org"; // Free, public, no API key required
        const domainInat = "api.inaturalist.org";

        // Inject Leaflet CSS
        const leafletCss = document.createElement('link');
        leafletCss.rel = 'stylesheet';
        leafletCss.href = protocol + domainUnpkg + "/leaflet@1.9.4/dist/leaflet.css";
        document.head.appendChild(leafletCss);

        // Inject Leaflet JavaScript
        const leafletJs = document.createElement('script');
        leafletJs.src = protocol + domainUnpkg + "/leaflet@1.9.4/dist/leaflet.js";
        document.body.appendChild(leafletJs);

        leafletJs.onload = function() {
            // Initialize map centered on Europe
            const map = L.map('map').setView([50.0, 15.0], 4);

            // Assemble a 100% free OpenStreetMap URL with zero keys needed
            const baseMapUrl = protocol + domainOsm + "/{z}/{x}/{y}.png";
            L.tileLayer(baseMapUrl, {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            const europePlaceId = 97391; 
            
            // Build iNaturalist overlays dynamically
            function getInatTileUrl(taxonId, colorHex) {
                return protocol + domainInat + `/v1/grid/{z}/{x}/{y}.png?taxon_id=${taxonId}&place_id=${europePlaceId}&color=${encodeURIComponent(colorHex)}`;
            }

            // Create Observation Layers
            const blackLocustLayer = L.tileLayer(getInatTileUrl(56066, '#ff3333'), { opacity: 0.80 }).addTo(map);
            const hackberryLayer   = L.tileLayer(getInatTileUrl(54857, '#00aa00'), { opacity: 0.80 }).addTo(map); // Darker green for light maps
            const boxElderLayer    = L.tileLayer(getInatTileUrl(47726, '#3333ff'), { opacity: 0.80 }).addTo(map);
            const blackCherryLayer = L.tileLayer(getInatTileUrl(50212, '#cc00cc'), { opacity: 0.80 }).addTo(map);
            
            // Layer Toggle Menu Control
            const overlayMaps = {
                "<span style='color: #ff3333; font-weight: bold;'>Black Locust</span>": blackLocustLayer,
                "<span style='color: #00aa00; font-weight: bold;'>Common Hackberry</span>": hackberryLayer,
                "<span style='color: #3333ff; font-weight: bold;'>Box Elder</span>": boxElderLayer,
                "<span style='color: #cc00cc; font-weight: bold;'>Black Cherry</span>": blackCherryLayer
            };

            L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);
        };
    </script>
</body>
</html>
